<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te han pasado una nota · Cuaderna</title>
<meta name="description" content="Te han pasado una nota con Cuaderna. Ábrela, márcala como hecha o guárdala en tu Cuaderna.">
<meta property="og:title" content="Te han pasado una nota">
<meta property="og:description" content="Ábrela aquí, sin instalar nada. Puedes ir marcando lo que hagas y avisar cuando esté.">
<meta property="og:image" content="https://jamormar.github.io/chispa/nota/vista.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:site_name" content="Cuaderna"><meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4ECDD">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4ECDD;--papel:#FBF6EC;--tinta:#2B1D14;--suave:#7A6652;--linea:#E3D6BE;--lacre:#A8322D;--lacre-soft:#F4DFD3;--mostaza:#F0C96A;--crema:#FBF3E4;--verde:#1C8F4B}
@media (prefers-color-scheme: dark){:root{--bg:#1E1510;--papel:#2A1E16;--tinta:#F1E6D2;--suave:#B9A48A;--linea:#45331F;--lacre-soft:#3D221C;--mostaza:#C9A04A;--crema:#FBF3E4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 "Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(122,102,82,.13) 1.2px,transparent 1.6px);background-size:16px 16px}
.envoltura{max-width:560px;margin:0 auto;padding:22px 16px 40px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2{font-family:"Fraunces",Georgia,serif;letter-spacing:-.01em;margin:0}
.de{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--lacre);color:var(--crema);font:700 20px "Fraunces",serif;border:3px solid var(--tinta);flex:none}
.de small{display:block;color:var(--suave);font-size:14px}
.de b{font:700 20px/1.2 "Fraunces",Georgia,serif}
.motivo{margin:14px 0 0;background:var(--papel);border-left:4px solid var(--lacre);border-radius:12px;padding:12px 16px;font-style:italic;font-size:17px}
.limite{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--mostaza);color:#2B1D14;border:3px solid var(--tinta);border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;box-shadow:3px 3px 0 var(--tinta)}
.nota{margin-top:20px;background:var(--papel);border:3px solid var(--tinta);border-radius:20px;padding:20px;box-shadow:6px 6px 0 var(--tinta)}
.nota h1{font-size:28px;line-height:1.15}
.nota .txt{margin-top:10px;white-space:pre-wrap;color:var(--tinta)}
.nota .meta{margin-top:12px;color:var(--suave);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px}
.lista{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.lista li{display:flex;gap:12px;align-items:flex-start;padding:8px 4px;border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2.5px solid var(--suave);display:grid;place-items:center;margin-top:1px}
.lista li.on .ck{background:var(--verde);border-color:var(--verde);color:#fff}
.lista li.on span{color:var(--suave);text-decoration:line-through}
.ck svg{width:15px;height:15px;stroke-width:3;opacity:0}.lista li.on .ck svg{opacity:1}
.acciones{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.boton{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 18px;border-radius:16px;border:3px solid var(--tinta);
  background:var(--verde);color:#fff;font:700 17px "Figtree",sans-serif;text-decoration:none;box-shadow:5px 5px 0 var(--tinta);cursor:pointer}
.boton:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--tinta)}
.boton svg{width:21px;height:21px;stroke-width:2.2}
.boton.sec{background:var(--papel);color:var(--tinta)}
.hecho-ok{display:none;text-align:center;font-weight:700;color:var(--verde);margin-top:4px}
.otra{font-size:14px;color:var(--suave);text-align:center}
.otra a{color:var(--tinta)}
/* invitación */
.invita{margin-top:34px;background:#2B1D14;color:#FBF3E4;border:1px solid rgba(251,243,228,.12);border-radius:24px;padding:22px 20px;position:relative;overflow:hidden}
.invita::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(208,97,79,.45),transparent 70%)}
.invita .cab{display:flex;align-items:center;gap:14px;position:relative}
.invita img{width:58px;height:58px;border-radius:16px;border:3px solid #FBF3E4}
.invita h2{font-size:24px;color:#FBF3E4}
.invita .lema{font:italic 600 15px "Fraunces",Georgia,serif;color:#E9D9BF;margin-top:2px}
.invita ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:9px;position:relative}
.invita li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#F3E8D6}
.invita li svg{width:20px;height:20px;color:var(--mostaza);margin-top:1px}
.invita .gratis{margin-top:14px;font-size:14px;color:#E9D9BF;position:relative}
.invita .botones{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;position:relative}
.invita .boton{flex:1;min-width:140px;white-space:nowrap;padding:14px 10px!important;background:#A8322D;color:#FBF3E4;border-color:#FBF3E4;box-shadow:4px 4px 0 rgba(251,243,228,.35);font-size:16px;padding:14px}
.invita .boton.sec{background:transparent;color:#FBF3E4}
@media (prefers-color-scheme: dark){.invita{background:#3A281C}}
.abrir-app{display:none}.android .abrir-app{display:flex}
.error{text-align:center;padding:60px 10px}
footer{text-align:center;color:var(--suave);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="envoltura" id="raiz"></div>
<script src="../servidor.js"></script>
<script>
"use strict";
const APP = new URL("../", location.href).href;          // la app de Cuaderna
const BIENVENIDA = APP + "bienvenida/";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const ic = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const I = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  wa: '<path d="M4.2 19.8l1.1-3.9A8.2 8.2 0 1 1 8.4 18.9z"/><path d="M9.2 8.4c-.4 1.9 1.6 5 4.4 5.9.7.2 1.3-.2 1.7-.8l-1.4-1.1-.9.6c-.9-.4-1.9-1.4-2.3-2.3l.6-.9-1.1-1.4c-.4.1-.9.4-1 0z"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>',
  libro: '<path d="M5 4.5h10.5a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h10.5"/>',
  cal: '<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  mic: '<rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  spark: '<path d="M12 3.5c.7 4.3 2.7 6.3 7 7-4.3.7-6.3 2.7-7 7-.7-4.3-2.7-6.3-7-7 4.3-.7 6.3-2.7 7-7z"/>',
  campana: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21a2 2 0 0 0 4 0"/>',
  compartir: '<path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/>',
  play: '<path d="M8 5.5v13l10.5-6.5z"/>'
};
function bytesDe(b64){ const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function desempaquetar(t){
  if (t[0] === "c"){ const b = String(window.CUADERNA_API || "").replace(/\/+$/, ""); const r = await fetch(`${b}/corto/${encodeURIComponent(t.slice(1))}`); if (!r.ok) throw new Error("caducado"); t = (await r.json()).d; }
  const bytes = bytesDe(t.slice(1));
  if (t[0] === "z"){ const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(st).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function empaquetar(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  if (window.CompressionStream){ try { const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "z" + b64(await new Response(st).arrayBuffer()); } catch(e){} }
  return "j" + b64(bytes);
}
const plano = t => String(t || "").replace(/^#{1,3}\s+/gm, "").replace(/\*\*([^*\n]+)\*\*/g, "$1").replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, "$1");
const RX_ITEM = /^\s*(?:[-*•]\s*)?\[( |x|X)?\]\s?(.*)$/;
function partir(t){
  const intro = [], items = []; let en = false;
  for (const l of String(t || "").split("\n")){
    const m = l.match(RX_ITEM);
    if (m){ en = true; items.push({hecho: (m[1] || "").toLowerCase() === "x", texto: m[2]}); }
    else if (en){ if (l.trim()) items.push({hecho: false, texto: l.trim()}); }
    else intro.push(l);
  }
  return {intro: plano(intro.join("\n")).trim(), items};
}
const fechaBonita = (f, h) => { try { const d = new Date(f + "T12:00"); let s = d.toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long"}); s = s[0].toUpperCase() + s.slice(1); return h ? `${s}, a las ${h}` : s; } catch(e){ return f; } };
const guardado = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

// ¿Android? Entonces se intenta abrir la app de Cuaderna (si no está, se queda en esta página)
const android = /android/i.test(navigator.userAgent);
const intentApp = (query, respaldo) => `intent://abrir?${query}#Intent;scheme=es.jamormar.chispa;package=es.jamormar.chispa;S.browser_fallback_url=${encodeURIComponent(respaldo)};end`;
async function pintar(){
  const t = location.hash.slice(1);
  let d = null;
  try { if (t) d = await desempaquetar(decodeURIComponent(t)); } catch(e){}
  if (!d){ $("#raiz").innerHTML = `<div class="error"><h1>No se puede abrir esta nota</h1><p>El enlace parece incompleto. Pide a quien te la mandó que te la vuelva a enviar.</p><p><a href="${BIENVENIDA}">¿Qué es Cuaderna?</a></p></div>`; return; }
  const de = d.de?.n || "Alguien", primero = de.split(/\s+/)[0];
  // con la app instalada, la nota se abre directamente allí (una vez; si no está instalada, se sigue aquí)
  if (android && !/[?&]web=1/.test(location.search)){ try { if (!sessionStorage.getItem("cuaderna.app." + t)){ sessionStorage.setItem("cuaderna.app." + t, "1");
    location.href = intentApp("asignacion=" + encodeURIComponent(t), location.origin + location.pathname + "?web=1" + location.hash); } } catch(e){} }
  const {intro, items} = partir(d.x);
  const titulo = d.t || intro.split("\n")[0] || "Una nota";
  const texto = d.t ? intro : intro.split("\n").slice(1).join("\n").trim();
  const clave = "cuaderna.compartida." + d.id, est = guardado(clave) || {};
  const marcados = est.items || items.map(i => i.hecho);
  document.title = `${titulo} · Te la pasa ${primero}`;
  $("#raiz").innerHTML = `
    <div class="de"><div class="av">${esc(de[0] || "?").toUpperCase()}</div><div><small>Te ha pasado una nota</small><b>${esc(de)}</b></div></div>
    ${d.m ? `<div class="motivo">«${esc(d.m)}»</div>` : ""}
    ${d.l ? `<div class="limite">${ic(I.cal)}Para el ${esc(fechaBonita(d.l).replace(/^./, c => c.toLowerCase()))}</div>` : ""}
    <article class="nota">
      <h1>${esc(titulo)}</h1>
      ${texto ? `<div class="txt">${esc(texto)}</div>` : ""}
      ${items.length ? `<ul class="lista">${items.map((it, i) => `<li data-i="${i}" class="${marcados[i] ? "on" : ""}"><span class="ck">${ic(I.check)}</span><span>${esc(it.texto)}</span></li>`).join("")}</ul>` : ""}
      ${d.f || d.p?.nombre ? `<div class="meta">${d.f ? `<span>${ic(I.cal)} ${esc(fechaBonita(d.f, d.h))}</span>` : ""}${d.p?.nombre ? `<span>Para: ${esc(d.p.nombre)}</span>` : ""}</div>` : ""}
    </article>
    <div class="acciones">
      <button class="boton" id="bHecho">${ic(I.check)}¡Hecho! Avisar a ${esc(primero)}</button>
      <div class="hecho-ok" id="hechoOk">Avisado. ¡Gracias!</div>
      <a class="boton sec" id="bGuardar" href="${android ? intentApp("asignacion=" + encodeURIComponent(t), APP + "?asignacion=" + encodeURIComponent(t)) : APP + "?asignacion=" + encodeURIComponent(t)}">${ic(I.libro)}${android ? "Abrir en mi app Cuaderna" : "Guardarla en mi Cuaderna"}</a>
      ${d.de?.e ? `<div class="otra">¿Prefieres avisar por correo? <a href="#" id="bCorreo">Escribir a ${esc(primero)}</a></div>` : ""}
    </div>
    <section class="invita">
      <div class="cab"><img src="../icon-192.png" alt=""><div><h2>Esta nota viene de Cuaderna</h2><div class="lema">Lo que se te ocurre, bien guardado.</div></div></div>
      <ul>
        <li>${ic(I.mic)}<span>Dicta una idea en segundos, incluso conduciendo.</span></li>
        <li>${ic(I.spark)}<span>Se ordena sola: título, fecha, para quién y tareas.</span></li>
        <li>${ic(I.campana)}<span>Te lo recuerda a tiempo, y nada se te olvida.</span></li>
        <li>${ic(I.compartir)}<span>Pasa notas como esta a tu familia, amigos o compañeros.</span></li>
      </ul>
      <div class="gratis">Es gratis y puedes probarla sin crear ninguna cuenta.</div>
      <div class="botones"><a class="boton" href="${BIENVENIDA}#instalar">Probar Cuaderna</a><a class="boton sec" href="${BIENVENIDA}">${ic(I.play)}Ver el vídeo</a></div>
    </section>
    <footer>Enviado por ${esc(de)} con Cuaderna · <a href="${BIENVENIDA}" style="color:inherit">jamormar.github.io/chispa</a></footer>`;
  // casillas: se pueden ir marcando (se recuerdan en este móvil)
  const ev = e => { try { window.cuadernaEvento?.(e); } catch(err){} };
  if (!est.abierta){ ev("nota_abierta"); guardar(clave, Object.assign(est, {abierta: true})); }
  $("#raiz").querySelectorAll('a[href*="?asignacion="]').forEach(a => a.addEventListener("click", () => ev("nota_guardar")));
  $("#raiz").querySelector('.invita .botones a:first-child').addEventListener("click", () => ev("invita_probar"));
  $("#raiz").querySelector('.invita .botones a:last-child').addEventListener("click", () => ev("invita_video"));
  $("#raiz").querySelectorAll(".lista li").forEach(li => li.onclick = () => { const i = +li.dataset.i; marcados[i] = !marcados[i]; li.classList.toggle("on", marcados[i]); guardar(clave, {...est, items: marcados}); });
  const enlaceHecho = async () => APP + "?hecho=" + await empaquetar({v: 1, id: d.id, por: {n: "", e: ""}, en: new Date().toISOString()});
  const mensaje = async () => `✅ Hecho: *${titulo}*${items.length ? `\n${items.map((it, i) => (marcados[i] ? "☑ " : "☐ ") + it.texto).join("\n")}` : ""}\n\nToca aquí para marcarla en tu Cuaderna:\n${await enlaceHecho()}`;
  if (est.avisado) $("#hechoOk").style.display = "block";
  $("#bHecho").onclick = async () => {
    const url = `https://wa.me/${d.de?.tel ? String(d.de.tel).replace(/\D/g, "") : ""}?text=${encodeURIComponent(await mensaje())}`;
    if (!est.avisado) ev("nota_hecha");
    guardar(clave, {...est, items: marcados, avisado: true}); $("#hechoOk").style.display = "block";
    location.href = url;
  };
  if ($("#bCorreo")) $("#bCorreo").onclick = async e => { e.preventDefault();
    location.href = `mailto:${encodeURIComponent(d.de.e)}?subject=${encodeURIComponent("Hecho: " + titulo)}&body=${encodeURIComponent(await mensaje())}`;
    guardar(clave, {...est, items: marcados, avisado: true}); $("#hechoOk").style.display = "block"; };
}
pintar();
addEventListener("hashchange", pintar);
</script>
</body>
</html>
