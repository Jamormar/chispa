name: App Android

# Compila la app de Chispa cada vez que cambia algo en app-android/
# y la publica en «Releases» para descargarla desde el móvil.
on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Aplicar las piezas de Chispa
        run: node scripts/aplicar.mjs

      - name: Sincronizar plugins
        run: npx cap sync android

      - name: Preparar la firma
        env:
          KS_B64: ${{ secrets.CHISPA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Falta el secreto CHISPA_KEYSTORE_B64"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/chispa.keystore

      - name: Compilar el APK
        working-directory: app-android/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          CHISPA_KS_PASS: ${{ secrets.CHISPA_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Chispa.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Chispa-${{ github.run_number }}
          path: app-android/Chispa.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" Chispa.apk \
            --title "Chispa para Android 1.0.${{ github.run_number }}" \
            --notes "Descarga Chispa.apk desde el móvil e instálala encima de la anterior." \
            --latest
