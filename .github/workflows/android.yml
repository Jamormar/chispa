name: App Android

# Compila la app de Cuaderna cada vez que cambia algo en app-android/
# y la publica en «Releases» para descargarla desde el móvil.
on:
  push:
    branches: [main]
    paths:
      - "app-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Aplicar las piezas de Cuaderna
        run: node scripts/aplicar.mjs

      - name: Sincronizar plugins
        run: npx cap sync android

      - name: Preparar la firma
        env:
          KS_B64: ${{ secrets.CHISPA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Falta el secreto CHISPA_KEYSTORE_B64: se firma con una llave de prueba y no se publica"
            keytool -genkeypair -keystore android/app/chispa.keystore -alias chispa -keyalg RSA -keysize 2048 -validity 365 -storepass prueba1234 -keypass prueba1234 -dname "CN=Prueba"
            echo "CHISPA_KS_PASS=prueba1234" >> "$GITHUB_ENV"
            echo "PRUEBA=1" >> "$GITHUB_ENV"
          else
            echo "$KS_B64" | base64 -d > android/app/chispa.keystore
          fi

      - name: Compilar el APK
        working-directory: app-android/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KS_SECRETO: ${{ secrets.CHISPA_KS_PASS }}
        run: |
          if [ -z "$PRUEBA" ]; then export CHISPA_KS_PASS="$KS_SECRETO"; fi
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee ../compilacion.log; then
            # los errores de Java aparecen como avisos en la ejecución
            grep -E "error:|e: |What went wrong" -A3 ../compilacion.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Cuaderna.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Cuaderna-${{ github.run_number }}
          path: app-android/Cuaderna.apk

      - name: Publicar en Releases
        if: env.PRUEBA != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" Cuaderna.apk \
            --title "Cuaderna para Android 1.0.${{ github.run_number }}" \
            --notes "Descarga Cuaderna.apk desde el móvil e instálala encima de la anterior." \
            --latest
