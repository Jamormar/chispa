<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7FA">
<title>Chispa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --ink:#16213A; --bg:#F6F7FA; --surface:#FFFFFF; --raise:#EEF1F6; --line:#E4E8EF; --text:#16213A; --muted:#66728A; --faint:#A3ACBD;
  --spark:#F4B63E; --spark-hi:#FFD889; --spark-deep:#D9931A; --spark-soft:#FDF3DD; --spark-text:#8A5E0B;
  --work:#4767A8; --work-soft:#E9EEF8; --home:#2C9580; --home-soft:#E2F3EE;
  --danger:#C9503C; --danger-soft:#FBEAE6;
  --on-ink:#FFFFFF; --dots:#DCE1EA;
  --float:0 12px 32px -14px rgba(22,33,58,.28);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --ink:#E8ECF4; --bg:#0D1221; --surface:#151C2E; --raise:#1D263B; --line:#263049; --text:#E8ECF4; --muted:#94A0B8; --faint:#5C6880;
  --spark-soft:#33290F; --spark-text:#F4C566; --work:#86A3E0; --work-soft:#1C2742; --home:#5CC4AC; --home-soft:#14302A;
  --danger:#E4806E; --danger-soft:#3A1F1A; --on-ink:#0D1221; --dots:#222C42; --float:0 12px 32px -14px rgba(0,0,0,.6);
}
:root[data-theme="noche"]{
  --ink:#1E1E1E; --bg:#000; --surface:#060606; --raise:#0F0F0F; --line:#171717; --text:#7C7C7C; --muted:#4E4E4E; --faint:#333;
  --spark:#7A5D1E; --spark-hi:#8F6E28; --spark-deep:#5E4614; --spark-soft:#140F05; --spark-text:#7A5D1E;
  --work:#4B5A78; --work-soft:#0C0F16; --home:#3F6B61; --home-soft:#08110F; --danger:#7A3A30; --danger-soft:#140806;
  --on-ink:#8A8A8A; --dots:#121212; --float:none;
}
:root[data-theme="noche"] .badge{background:#4A3910;color:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--body);font-size:15.5px;line-height:1.45;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
:focus-visible{outline:2px solid var(--spark);outline-offset:2px;border-radius:10px}
.oculto{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Entrada ===== */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login .marca{width:96px;height:96px;border-radius:28px;box-shadow:0 18px 50px -12px rgba(244,182,62,.55)}
#login h1{font-family:var(--display);font-weight:700;font-size:46px;letter-spacing:-.02em;margin:22px 0 4px}
#login p{color:var(--muted);max-width:340px;margin:6px 0}
.btn-ms{display:inline-flex;align-items:center;gap:12px;margin-top:26px;background:var(--ink);color:var(--on-ink);padding:14px 22px;border-radius:16px;font-weight:600}

/* ===== Estructura ===== */
#app{min-height:100dvh}
#side{display:none}
#main{padding:calc(env(safe-area-inset-top) + 12px) 16px 110px;max-width:760px;margin:0 auto}
.cab{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:6px}
.cab h1{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.02em;margin:0;line-height:1.1}
.cab .sub{color:var(--muted);font-size:14px;margin-top:2px}
.cab .esp{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;color:var(--muted);font-size:13px;background:var(--surface);border:1px solid var(--line)}
.sync.ok{color:var(--home)} .sync.pend{color:var(--spark-text)} .sync.err{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.sync .giro{animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;display:flex;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--float)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;border-radius:18px;color:var(--muted);font-size:11.5px;font-weight:500;position:relative}
#tabs button svg{width:23px;height:23px}
#tabs button.activo{color:var(--text);background:var(--raise)}
#tabs .badge,.side-nav .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--spark);color:#3a2700;font-size:10.5px;font-weight:700;display:grid;place-items:center}

@media (min-width:900px){
  #side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:240px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
  #side .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;padding:4px 10px 22px}
  #side .logo img{width:34px;height:34px;border-radius:10px}
  .side-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;position:relative;text-align:left}
  .side-nav button.activo{background:var(--raise);color:var(--text)}
  .side-nav button:hover{color:var(--text)}
  .side-nav .badge{position:static;margin-left:auto}
  #side .pie-side{margin-top:auto;padding:8px}
  #main{margin-left:240px;max-width:none;padding:28px 40px 60px}
  #main>section{max-width:760px;margin:0 auto}
  #tabs{display:none}
  .cab-sync{display:none}
}

/* ===== Anotar ===== */
#vAnotar{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top) - 132px)}
@media (min-width:900px){ #vAnotar{height:calc(100dvh - 120px);max-height:760px} }
.seg{display:inline-flex;background:var(--raise);border-radius:14px;padding:3px;position:relative}
.seg button{padding:7px 14px;border-radius:11px;color:var(--muted);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(22,33,58,.08)}
.seg button.on[data-a="trabajo"]{color:var(--work)} .seg button.on[data-a="personal"]{color:var(--home)}
.papel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative}
#cTexto{border:0;outline:0;resize:none;background:transparent;padding:20px 20px 6px;font-size:20px;line-height:1.35;min-height:64px;max-height:40%;font-family:var(--body)}
#cTexto::placeholder{color:var(--faint)}
.detect{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px;min-height:0}
.detect:not(:empty){padding-bottom:8px}
.dchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:10px;font-size:13.5px;font-weight:500;background:var(--spark-soft);color:var(--spark-text)}
.dchip svg{width:15px;height:15px}
.dchip .q{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;opacity:.7}
.lienzo{flex:1;position:relative;min-height:120px;margin:0 10px 10px;border-radius:20px;
  background-image:radial-gradient(var(--dots) 1.3px,transparent 1.4px);background-size:22px 22px;background-color:var(--bg)}
#lienzo{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:20px}
.pista{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--faint);pointer-events:none;font-size:14.5px}
.pista svg{width:26px;height:26px}
.adj{display:flex;gap:8px;padding:0 18px 10px;overflow-x:auto}
.adj:empty{display:none}
.adj img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.adj .aud{display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 14px;border-radius:12px;background:var(--raise);color:var(--muted);font-size:13.5px;flex:none}
/* Grabación */
.grab{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.grab .tiempo{font-family:var(--display);font-size:56px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ondas{display:flex;align-items:center;gap:3px;height:64px}
.ondas i{display:block;width:4px;border-radius:3px;background:var(--spark);height:6px;transition:height .08s}
.grab .vivo{color:var(--muted);max-width:90%;text-align:center;font-size:16px;min-height:1.4em}
.dock{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 0;gap:8px}
.tool{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.tool svg{width:23px;height:23px}
.tool.guardar{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.tool:active{transform:scale(.94)}
.chispa{--lvl:0;width:82px;height:82px;border-radius:50%;display:grid;place-items:center;position:relative;color:#3a2700;
  background:radial-gradient(circle at 34% 28%,var(--spark-hi),var(--spark) 55%,var(--spark-deep));box-shadow:0 14px 34px -10px rgba(244,182,62,.75),inset 0 -3px 0 rgba(0,0,0,.08)}
.chispa svg{width:32px;height:32px;stroke-width:2}
.chispa::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--spark);opacity:0;transform:scale(calc(1 + var(--lvl)*.45));transition:transform .08s,opacity .2s}
.chispa.rec::before{opacity:.55}
.chispa.rec{background:radial-gradient(circle at 34% 28%,#ffb3a3,var(--danger) 60%,#a63b2a);color:#fff;box-shadow:0 14px 34px -10px rgba(201,80,60,.7)}
:root[data-theme="noche"] .chispa{color:#000;box-shadow:none}

/* ===== Listas ===== */
.resumen{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.pildora{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.pildora b{color:var(--text);font-weight:600}
.pildora.alerta b{color:var(--danger)}
.seccion{margin-top:26px}
.seccion h3{display:flex;align-items:center;gap:8px;margin:0 0 8px 4px;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.seccion h3 .c{font-family:var(--body);font-size:13px;color:var(--faint);font-weight:500}
.seccion h3 svg{width:18px;height:18px;color:var(--muted)}
.seccion.vencidas h3 svg{color:var(--danger)} .seccion.noche h3 svg{color:var(--work)} .seccion.anclas h3 svg{color:var(--spark-deep)}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 6px}
.fila{display:flex;align-items:flex-start;gap:12px;padding:13px 10px;cursor:pointer;border-radius:14px}
@media (hover:hover){ .fila:hover{background:var(--raise)} }
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--work);flex:none;display:grid;place-items:center;margin-top:-1px;color:transparent;transition:background .15s,transform .15s}
.chk.personal{border-color:var(--home)}
.chk svg{width:14px;height:14px;stroke-width:3}
.fila.hecha .chk{background:var(--work);color:#fff} .fila.hecha .chk.personal{background:var(--home)}
.chk.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.fila .ct{flex:1;min-width:0}
.fila .tt{font-size:15.5px;line-height:1.35;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fila.hecha .tt{color:var(--faint);text-decoration:line-through}
.fila .tt .vacio{color:var(--muted);font-style:italic}
.mt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--muted)}
.mt span{display:inline-flex;align-items:center;gap:4px}
.mt svg{width:14px;height:14px}
.mt .fe.hoy{color:var(--spark-text);font-weight:600} .mt .fe.venc{color:var(--danger);font-weight:600}
.mt .nube{color:var(--spark-text)}
.fila .mini{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--raise)}
.resolver{display:flex;gap:8px;margin-top:8px}
.resolver input{flex:1;min-width:0;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.resolver button{height:38px;padding:0 14px;border-radius:11px;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:14px}
.vacio-grande{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 20px;color:var(--muted)}
.vacio-grande .halo{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--spark-soft);color:var(--spark-deep)}
.vacio-grande .halo svg{width:30px;height:30px}
.vacio-grande b{color:var(--text);font-family:var(--display);font-size:18px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:13px;font-weight:600;font-size:14.5px;background:var(--ink);color:var(--on-ink)}
.btn.sec{background:var(--raise);color:var(--text)}
.btn svg{width:18px;height:18px}
.correo{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}

/* Buscador */
.busca{position:relative;margin:10px 0 10px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.busca input{width:100%;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 44px;outline:0}
.busca input:focus{border-color:var(--work)}
.filtros{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros .sep{width:1px;background:var(--line);flex:none;margin:6px 2px}
.fchip{height:34px;padding:0 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;flex:none}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
@media (min-width:900px){ .filtros{margin:0;padding-left:2px;padding-right:2px;flex-wrap:wrap} }
.dia{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);margin:22px 0 8px 4px}
.cuenta{font-size:13px;color:var(--faint);margin:4px 4px 0}

/* ===== Hoja de edición ===== */
.velo{position:fixed;inset:0;background:rgba(10,15,28,.38);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:94dvh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.25,1),visibility 0s .32s;box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
.hoja.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.85,.25,1)}
.hoja .asa{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@media (min-width:900px){
  .hoja{left:50%;top:50%;bottom:auto;right:auto;width:640px;max-height:88vh;border-radius:26px;padding:18px 24px 24px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .25s,opacity .2s,visibility 0s .25s}
  .hoja.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;transition:transform .25s,opacity .2s}
  .hoja .asa{display:none}
}
.hcab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hcab .esp{flex:1}
.ibtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--raise);color:var(--text)}
.hinfo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:2px 2px 10px}
.hinfo span,.hinfo a{display:inline-flex;align-items:center;gap:5px;color:inherit;text-decoration:none}
.hinfo svg{width:15px;height:15px}
#eTexto{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:19px;line-height:1.4;padding:4px 2px;min-height:80px}
.transc{border-left:3px solid var(--spark);padding:4px 0 4px 12px;color:var(--muted);font-size:14.5px;margin:6px 0 4px}
.galeria{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px}
.galeria .ft{position:relative;flex:none}
.galeria img{width:118px;height:118px;border-radius:16px;object-fit:cover;background:var(--raise);display:block;cursor:zoom-in}
.galeria .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:10px;background:rgba(10,15,28,.6);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.galeria .x svg{width:15px;height:15px}
.galeria .add{width:118px;height:118px;border-radius:16px;border:1.5px dashed var(--line);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;flex:none}
.player{display:flex;align-items:center;gap:12px;background:var(--raise);border-radius:16px;padding:10px 12px;margin-top:10px}
.player .pp{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.player .pp svg{width:18px;height:18px}
.player .barra{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;cursor:pointer}
.player .barra i{position:absolute;inset:0 auto 0 0;width:0;background:var(--spark);border-radius:3px}
.player .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.props{margin-top:12px}
.prop{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.prop>svg{color:var(--muted)}
.prop .lbl{width:84px;color:var(--muted);font-size:14px}
.prop .val{flex:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:180px}
.prop select,.prop input{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:0 10px;min-width:0}
.prop input[type=text]{flex:1}
.opc{height:34px;padding:0 12px;border-radius:11px;background:var(--raise);font-size:13.5px;font-weight:500;color:var(--muted)}
.opc.on{background:var(--ink);color:var(--on-ink)}
@media (max-width:899px){ .prop .lbl{flex:1} .prop .val{flex-basis:100%;padding-left:32px;min-width:0} }
.hpie{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hpie .borrar{color:var(--danger);background:var(--danger-soft)}
.hpie .esp{flex:1}

/* ===== Ancla ===== */
.hoja.mini h3{font-family:var(--display);font-size:22px;margin:6px 0 2px;display:flex;align-items:center;gap:10px}
.hoja.mini p{color:var(--muted);margin:0 0 14px}
.hoja.mini input{width:100%;height:50px;border-radius:15px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-size:18px}

/* ===== Estadísticas y ajustes ===== */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--muted);font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:12px}
.panel h3{margin:0 0 12px;font-family:var(--display);font-size:17px;font-weight:600}
.bar{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:14px}
.bar .et{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .pi{flex:1;height:10px;border-radius:5px;background:var(--raise);overflow:hidden}
.bar .pi i{display:block;height:100%;border-radius:5px;background:var(--work)}
.bar .v{width:30px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.grupo{margin-top:22px}
.grupo>h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 8px 6px;color:var(--muted)}
.grupo .caja{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
.ajuste{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px;flex-wrap:wrap}
.ajuste:last-child{border-bottom:0}
.ajuste>svg{color:var(--muted)}
.ajuste .lbl{flex:1;min-width:150px}
.ajuste .lbl small{display:block;color:var(--muted);font-size:12.5px}
.ajuste input,.ajuste select,.ajuste textarea{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 10px;height:40px}
.ajuste textarea{height:auto;width:100%;padding:10px;resize:vertical}
.ajuste input[type=text],.ajuste input[type=email]{flex:1;min-width:180px}
.enlaces{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.enlace{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;font-weight:600}
.enlace svg{width:22px;height:22px;color:var(--work)}
@media (min-width:900px){ .enlaces{display:none} }
.ayuda h3{font-family:var(--display);font-size:17px;margin:20px 0 4px}
.ayuda p,.ayuda li{color:var(--muted)}
.ayuda b{color:var(--text)}

/* Estadísticas */
:root{--cw:#3F63B0;--cp:#119C7C}
:root[data-theme="dark"]{--cw:#7090E0;--cp:#1FA886}
:root[data-theme="noche"]{--cw:#3D4C6B;--cp:#2D5A4F}
#vEstad .filtros{margin-top:6px}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--faint);margin-top:6px}
.kpi em.sube{color:var(--home)} .kpi em.mal{color:var(--danger);font-weight:600}
.dos{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1100px){ .dos{grid-template-columns:1fr 1fr} .dos .panel{margin-top:12px} }
.dos .panel{margin-top:12px}
.nota-panel{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.columnas{display:flex;align-items:flex-end;gap:3px;height:170px;padding-bottom:22px;position:relative;border-bottom:1px solid var(--line)}
.columnas .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:default;min-width:3px}
.columnas .col i{display:block;background:var(--cw);border-radius:4px 4px 0 0;min-height:0}
.columnas .col:hover i{background:var(--spark-deep)}
.columnas .col span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap}
.bar .et{width:150px;display:flex;flex-direction:column;line-height:1.25}
.bar .et small{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .et{overflow:hidden}
.bar .v{width:52px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.bar .v small{color:var(--faint);font-size:11px}
.reparto{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;margin:4px 0 12px}
.reparto i{display:block;height:100%}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:7px}
.leyenda i{width:11px;height:11px;border-radius:3px;display:inline-block}
.leyenda b{color:var(--text)}
.titular{font-family:var(--display);font-size:18px;font-weight:600;margin:-4px 0 14px;letter-spacing:-.01em}
.calor{display:grid;grid-template-columns:40px repeat(7,1fr);gap:4px;align-items:center}
.calor .ej{font-size:11.5px;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calor b{display:block;height:30px;border-radius:6px;background:color-mix(in srgb,var(--spark-deep) calc(var(--a)*100%),var(--raise))}
.mini-kpi{display:flex;align-items:baseline;gap:12px;margin:10px 0}
.mini-kpi b{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.mini-kpi span{color:var(--muted);font-size:14px}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--on-ink);font-size:13px;font-weight:500;padding:7px 11px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:260px;box-shadow:var(--float)}
.tip.on{opacity:1}
@media (max-width:899px){ .bar .et{width:112px} }
#visor{position:fixed;inset:0;background:rgba(5,8,15,.92);display:none;align-items:center;justify-content:center;z-index:50}
#visor img{max-width:96vw;max-height:92vh;border-radius:12px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:60;background:var(--ink);color:var(--on-ink);
  padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;box-shadow:var(--float)}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.toast.accion{pointer-events:auto}
.toast .deshacer{margin-left:6px;padding:5px 11px;border-radius:9px;background:color-mix(in srgb,var(--on-ink) 18%,transparent);color:var(--spark);font-weight:700;font-size:14px}
.desl{position:relative;border-bottom:1px solid var(--line)}
.desl:last-child{border-bottom:0}
.desl .fondo{position:absolute;inset:4px 0;border-radius:14px;display:flex;align-items:center;padding:0 18px;color:#fff;font-weight:600;gap:8px;opacity:0}
.desl .fondo svg{width:20px;height:20px}
.desl .fondo.hecha{background:var(--home);justify-content:flex-start}
.desl .fondo.borra{background:var(--danger);justify-content:flex-end}
.desl .fila{position:relative;background:var(--surface);border-bottom:0;touch-action:pan-y}
.desl .fila.volviendo{transition:transform .22s}
.ajuste .estado-t{font-size:13px;color:var(--muted)}
.ajuste .estado-t.ok{color:var(--home)}
.transcribiendo{display:inline-flex;align-items:center;gap:6px;color:var(--spark-text);font-size:13px}
.toast svg{width:18px;height:18px;color:var(--spark)}
</style>
</head>

<!-- Hoja de edición -->

</div>

const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[n] || ""}</svg>`;

/* ================= Conexión con Microsoft ================= */
const CLIENT_ID = "3dc57230-4cdb-4e60-bb83-2def7cd5441f";
const AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const pad = n => String(n).padStart(2, "0");
const isoDia = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoyISO = () => isoDia(new Date());
const masDias = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoDia(d); };
const hora = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const aFecha = iso => new Date(iso.length === 10 ? iso + "T12:00" : iso);
const fechaCorta = iso => aFecha(iso).toLocaleDateString("es-ES", {weekday: "short", day: "numeric", month: "short"}).replace(/\./g, "");
const fechaLarga = iso => aFecha(iso).toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long"});
function fechaRelativa(iso){
  const h = hoyISO(); if (iso === h) return "Hoy"; if (iso === masDias(1)) return "Mañana"; if (iso === masDias(-1)) return "Ayer";
  return fechaCorta(iso);
}
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
function toast(t, icono = "check", ms = 2600, deshacer = null){

const idb = {

    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("notas", {keyPath: "id"}); d.createObjectStore("blobs"); d.createObjectStore("kv"); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async op(store, modo, fn){ const d = await this.abrir(); return new Promise((ok, ko) => { const t = d.transaction(store, modo); const r = fn(t.objectStore(store)); t.oncomplete = () => ok(r && r.result); t.onerror = () => ko(t.error); }); },
  todas(){ return this.op("notas", "readonly", s => s.getAll()); },

let token = lsGet("chispa.token");
let necesitaLogin = false;
async function irALogin(silencioso = false){
  const verifier = aleatorio(48), state = aleatorio(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  lsSet("chispa.pkce", {verifier, state, silencioso});
  const p = new URLSearchParams({ client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT, response_mode: "query",
    scope: SCOPES, state, code_challenge: challenge, code_challenge_method: "S256" });
  if (silencioso){ p.set("prompt", "none"); const u = lsGet("chispa.usuario"); if (u) p.set("login_hint", u); }
  location.href = `${AUTH}/authorize?${p}`;
}
async function pedirToken(datos){
  const r = await fetch(`${AUTH}/token`, { method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams({client_id: CLIENT_ID, scope: SCOPES, redirect_uri: REDIRECT, ...datos}) });
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error_description || j.error || "Error de inicio de sesión"), {codigo: j.error});
  token = { access: j.access_token, refresh: j.refresh_token || token?.refresh, exp: Date.now() + (j.expires_in - 120) * 1000 };
  lsSet("chispa.token", token);
  try { const idt = JSON.parse(atob(j.id_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); if (idt.preferred_username) lsSet("chispa.usuario", idt.preferred_username); } catch(e){}
  necesitaLogin = false;
  return token.access;
}
async function volverDeLogin(){
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return null;
  const pk = lsGet("chispa.pkce"); localStorage.removeItem("chispa.pkce");
  history.replaceState(null, "", REDIRECT);
  if (q.has("error")) return q.get("error");
  if (!pk || pk.state !== q.get("state")) return "estado";
  try { await pedirToken({grant_type: "authorization_code", code: q.get("code"), code_verifier: pk.verifier}); return "ok"; }
  catch(e){ return e.message; }
}
async function accessToken(){
  if (token?.access && Date.now() < token.exp) return token.access;
  if (token?.refresh){
    try { return await pedirToken({grant_type: "refresh_token", refresh_token: token.refresh}); }
    catch(e){ if (e.codigo === "invalid_grant" || e.codigo === "interaction_required"){ token = null; lsSet("chispa.token", null); } else throw e; }
  }
  necesitaLogin = true;
  throw Object.assign(new Error("Hay que volver a entrar"), {login: true});
}

async function graph(url, opts = {}, reintento = true){
  const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: "Bearer " + await accessToken()}});
  if (r.status === 401 && reintento){ token.exp = 0; return graph(url, opts, false); }
  if ((r.status === 429 || r.status === 503) && reintento){ await new Promise(s => setTimeout(s, 3000)); return graph(url, opts, false); }
  return r;
}

const mismoNombre = (a, b) => a.toLowerCase() === b.toLowerCase();
async function asegurarCarpeta(ruta, crear = true){
  if (carpetas.has(ruta)) return carpetas.get(ruta);
  const partes = ruta.split("/"), nombre = partes.pop(), padre = partes.join("/");
  const pid = padre ? await asegurarCarpeta(padre, crear) : await idRaiz();
  if (!pid) return null;
  let it = (await hijos(pid)).find(x => x.folder && mismoNombre(x.name, nombre));
  if (!it){
    if (!crear) return null;
    const r = await graph(`${DRIVE}/items/${pid}/children`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: nombre, folder: {}, "@microsoft.graph.conflictBehavior": "fail"})});
    if (r.ok) it = await r.json();
    else if (r.status === 409) it = (await hijos(pid)).find(x => x.folder && mismoNombre(x.name, nombre));
    else throw await errorDe(r, `al crear la carpeta ${ruta}`);
  }
  if (!it) throw new Error("No se pudo preparar la carpeta " + ruta);

}
const separar = ruta => { const p = ruta.split("/"), nombre = p.pop(); return [p.join("/"), nombre]; };
async function subir(ruta, datos, tipo){
  const [padre, nombre] = separar(ruta);

  const r = await graph(`${DRIVE}/items/${pid}:/${encodeURIComponent(nombre)}:/content`, {method: "PUT", headers: {"Content-Type": tipo || "application/octet-stream"}, body: datos});
  if (!r.ok) throw await errorDe(r, `al subir ${ruta}`);

}

  const [padre, nombre] = separar(ruta);

async function sincronizar(forzar = false){
  if (sincronizando || !navigator.onLine || !token) return;
  if (!forzar && Date.now() - ultimaSync < 15000) return;
  sincronizando = true; pintarEstado();
  const fallos = [];
  try {
    for (const n of notas.filter(x => x._borrar && Date.now() - (x._borrarEn || 0) > 7000)){
      try {
        if (n._etag) for (const r of [`Notas/${n.id}.json`, n.audio, ...(n.fotos || [])].filter(Boolean)) await aPapelera(r);
        for (const r of n._subir || []) await idb.quitarBlob(r);
        await idb.quitar(n.id); notas = notas.filter(x => x !== n);
      } catch(e){ if (e.login) throw e; fallos.push(e.message); }
    }
    for (const n of notas.filter(x => x._pend && !x._borrar)){
      try {
        for (const r of [...(n._quitar || [])]){
          try { await aPapelera(r); n._quitar = n._quitar.filter(x => x !== r); await idb.quitarBlob(r); cacheUrl.delete(r); }
          catch(e){ if (e.login) throw e; fallos.push(e.message); }
        }
        for (const r of [...(n._subir || [])]){
          try { const b = await idb.blob(r); if (b && b.size) await subir(r, b, b.type); n._subir = n._subir.filter(x => x !== r); }
          catch(e){ if (e.login) throw e; fallos.push(e.message); }
        }
        const it = await subir(`Notas/${n.id}.json`, JSON.stringify(limpia(n), null, 2), "application/json");
        n._etag = it.eTag; n._pend = (n._subir || []).length > 0 || (n._quitar || []).length > 0;
        await idb.poner(n);
      } catch(e){ if (e.login) throw e; fallos.push(e.message); }
    }
    if (lsGet("chispa.cfgPend")){ const it = await subir("Configuracion/config.json", JSON.stringify(config, null, 2), "application/json"); lsSet("chispa.cfgEtag", it.eTag); lsSet("chispa.cfgPend", false); }
    const remotos = await listar("Notas"), vistos = new Set(), porBajar = [];
    for (const it of remotos){
      if (!it.file || !it.name.endsWith(".json")) continue;
      const id = it.name.slice(0, -5); vistos.add(id);
      const loc = notas.find(x => x.id === id);
      if (!loc || (!loc._pend && loc._etag !== it.eTag)) porBajar.push(it);
    }
    for (let i = 0; i < porBajar.length; i += 6){
      await Promise.all(porBajar.slice(i, i + 6).map(async it => {
        try { const n = await (await fetch(it["@microsoft.graph.downloadUrl"])).json(); n._etag = it.eTag; n._pend = false;
          await idb.poner(n); const k = notas.findIndex(x => x.id === n.id); if (k >= 0) notas[k] = n; else notas.push(n); } catch(e){}
      }));
    }
    let quitadas = 0;
    for (const n of [...notas]) if (!n._pend && !n._borrar && n._etag && !vistos.has(n.id)){ await idb.quitar(n.id); notas = notas.filter(x => x !== n); quitadas++; }
    const cfgIt = (await listar("Configuracion")).find(x => x.name === "config.json");
    if (cfgIt && cfgIt.eTag !== lsGet("chispa.cfgEtag") && !lsGet("chispa.cfgPend")){
      try { config = Object.assign(config, await (await fetch(cfgIt["@microsoft.graph.downloadUrl"])).json()); lsSet("chispa.config", config); lsSet("chispa.cfgEtag", cfgIt.eTag); } catch(e){}
    }
    ordenar(); errorSync = fallos[0] || ""; ultimaSync = Date.now();
    if (porBajar.length || quitadas) refrescar();
  } catch(e){
    errorSync = e.login ? "" : (e.message || "Error de sincronización");
  } finally {
    if (errorSync){ carpetas.clear(); raizId = null; }
    sincronizando = false; pintarEstado(); pintarBadges();
  }
}

/* ================= Detección de fechas, tipo y nombres ================= */
const DIAS = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function detectarFecha(texto, base = new Date()){
  const t = norm(texto), b = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  const mas = n => { const d = new Date(b); d.setDate(d.getDate() + n); return isoDia(d); };
  if (/\bpasado manana\b/.test(t)) return mas(2);
  if (/\bmanana\b/.test(t.replace(/\b(de|por) la manana\b/g, ""))) return mas(1);
  if (/\bhoy\b|\besta tarde\b|\besta noche\b/.test(t)) return mas(0);
  let m = t.match(/\b(?:en|dentro de)\s+(\d+|un|una|dos|tres|cuatro|cinco)\s+(dia|dias|semana|semanas)\b/);
  if (m){ const num = {un:1,una:1,dos:2,tres:3,cuatro:4,cinco:5}[m[1]] ?? Number(m[1]); return mas(num * (m[2].startsWith("semana") ? 7 : 1)); }
  if (/\b(la semana que viene|la proxima semana)\b/.test(t)){ const dd = (8 - b.getDay()) % 7 || 7; return mas(dd); }
  m = t.match(/\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);
  if (m){ let y = m[3] ? Number(m[3].length === 2 ? "20" + m[3] : m[3]) : b.getFullYear(); const d = new Date(y, Number(m[2]) - 1, Number(m[1])); if (!m[3] && d < b) d.setFullYear(y + 1); if (!isNaN(d)) return isoDia(d); }
  m = t.match(/\b(?:el\s+)?(?:dia\s+)?(\d{1,2})\s+de\s+([a-z]+)\b/);
  if (m && MESES.includes(m[2])){ const d = new Date(b.getFullYear(), MESES.indexOf(m[2]), Number(m[1])); if (d < b) d.setFullYear(d.getFullYear() + 1); return isoDia(d); }
  m = t.match(/\bel\s+(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b|\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\s+que viene\b/);
  if (m){ const obj = DIAS.indexOf(m[1] || m[2]); let dd = (obj - b.getDay() + 7) % 7; if (dd === 0) dd = 7; return mas(dd); }
  m = t.match(/\bel\s+dia\s+(\d{1,2})\b/);
  if (m){ const d = new Date(b.getFullYear(), b.getMonth(), Number(m[1])); if (d < b) d.setMonth(d.getMonth() + 1); return isoDia(d); }
  return null;
}
function detectarHora(texto){
  const t = norm(texto);
  let m = t.match(/\ba las (\d{1,2})(?:[:.h](\d{2}))?( y media| y cuarto| menos cuarto)?(?: (?:de la|por la) (manana|tarde|noche))?\b/) || t.match(/\b(\d{1,2})[:.](\d{2}) ?h\b()()/);
  if (!m) return null;
  let h = Number(m[1]), mi = m[2] ? Number(m[2]) : 0;
  if (m[3] === " y media") mi = 30; else if (m[3] === " y cuarto") mi = 15; else if (m[3] === " menos cuarto"){ h -= 1; mi = 45; }
  if ((m[4] === "tarde" || m[4] === "noche") && h < 12) h += 12;
  else if (!m[4] && h >= 1 && h <= 7) h += 12;            // «a las 5» en horario de trabajo = 17:00
  if (h > 23 || mi > 59) return null;
  return `${pad(h)}:${pad(mi)}`;
}
function sugerir(texto, base = new Date()){
  const t = norm(texto), s = {};
  s.fecha = detectarFecha(texto, base);
  s.hora = detectarHora(texto);
  if (s.hora && !s.fecha){ const ahora = `${pad(base.getHours())}:${pad(base.getMinutes())}`; s.fecha = s.hora > ahora ? isoDia(base) : (() => { const d = new Date(base); d.setDate(d.getDate() + 1); return isoDia(d); })(); }
  for (const cat of ["cliente", "proveedor", "companero"]){
    for (const nom of config.contactos?.[cat] || []){ const nn = norm(nom).trim(); if (nn.length > 2 && t.includes(nn)){ s.cat = cat; s.nombre = nom; break; } }
    if (s.cat) break;
  }
  if (/^\s*idea\b|\bidea:|\bse me ocurre\b/.test(t)) s.tipo = "idea";
  else if (s.fecha) s.tipo = "recordatorio";
  else if (/^\s*(llamar|enviar|mandar|revisar|preparar|pedir|hablar|comprar|preguntar|hacer|confirmar|reclamar|buscar|pagar)\b/.test(t)) s.tipo = "tarea";
  return s;
}

function pintarAdjuntos(){

// Escritura con el dedo
const cv = $("#lienzo"), cx = cv.getContext("2d");
function ajustarLienzo(){ const r = cv.getBoundingClientRect(), k = devicePixelRatio || 1; if (!r.width) return;
  if (cv.width !== Math.round(r.width*k) || cv.height !== Math.round(r.height*k)){
    const copia = borrador?.trazo ? cx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = Math.round(r.width*k); cv.height = Math.round(r.height*k); if (copia) cx.putImageData(copia, 0, 0); } }
function limpiarLienzo(){ cx.clearRect(0, 0, cv.width, cv.height); if (borrador) borrador.trazo = false; $("#pista").classList.remove("oculto"); }
(() => {
  let on = false;
  const p = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener("pointerdown", e => { on = true; tocado = true; cv.setPointerCapture(e.pointerId); cx.beginPath(); cx.moveTo(...p(e));
    cx.lineWidth = 5 * (devicePixelRatio || 1); cx.lineCap = cx.lineJoin = "round"; cx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--text"); });
  cv.addEventListener("pointermove", e => { if (!on) return; cx.lineTo(...p(e)); cx.stroke(); if (!borrador.trazo){ borrador.trazo = true; $("#pista").classList.add("oculto"); } });
  const fin = () => on = false; cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", fin);
})();
async function trazoComoImagen(){
  const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height; const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  const t = document.createElement("canvas"); t.width = cv.width; t.height = cv.height; const tc = t.getContext("2d");
  tc.drawImage(cv, 0, 0); tc.globalCompositeOperation = "source-in"; tc.fillStyle = "#16213A"; tc.fillRect(0, 0, t.width, t.height);
  g.drawImage(t, 0, 0); return new Promise(r => c.toBlob(r, "image/png"));
}

// Voz: guarda el audio original, muestra el nivel en vivo y transcribe si el móvil puede
let rec = null, sr = null, trozos = [], t0 = 0, alParar = null, actx = null, raf = 0, descartarVoz = false;
async function empezarVoz(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    trozos = []; t0 = Date.now(); descartarVoz = false; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => e.data.size && trozos.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); cancelAnimationFrame(raf); try { actx && actx.close(); } catch(e){} actx = null;
      if (!descartarVoz){ borrador.audio = new Blob(trozos, {type: rec.mimeType || trozos[0]?.type || "audio/webm"});
        const s = Math.round((Date.now() - t0) / 1000); borrador.dur = `${Math.floor(s/60)}:${pad(s%60)}`; }
      rec = null; $("#grab").classList.add("oculto"); pintarAdjuntos(); pintarDetectado();
      if (alParar){ const f = alParar; alParar = null; f(); } };
    rec.start(1000);
    // nivel de voz en vivo
    const ondas = [...document.querySelectorAll("#ondas i")], btn = $("#bMic");
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)(); const an = actx.createAnalyser(); an.fftSize = 512;
      actx.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize); let k = 0;
      const paso = () => { an.getByteTimeDomainData(buf); let s = 0; for (const v of buf){ const x = (v - 128) / 128; s += x * x; }
        const lvl = Math.min(1, Math.sqrt(s / buf.length) * 4); btn.style.setProperty("--lvl", lvl.toFixed(2));
        if (k++ % 3 === 0){ for (let i = 0; i < ondas.length - 1; i++) ondas[i].style.height = ondas[i+1].style.height || "6px"; ondas[ondas.length-1].style.height = (6 + lvl * 58) + "px"; }
        const s2 = Math.floor((Date.now() - t0) / 1000); $("#tiempo").textContent = `${Math.floor(s2/60)}:${pad(s2%60)}`;
        raf = requestAnimationFrame(paso); };
      paso();
    } catch(e){}
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    $("#vivo").textContent = esMovil() ? (voz() ? "Te escucho. El texto aparecerá al guardar." : "Te escucho. Se guarda el audio.") : "Te escucho…";
    if (disp.trans !== false && SR && !esMovil()){ try { sr = new SR(); sr.lang = "es-ES"; sr.continuous = true; sr.interimResults = true;
      sr.onresult = e => { let parcial = ""; for (let i = e.resultIndex; i < e.results.length; i++){ if (e.results[i].isFinal) borrador.transcripcion = (borrador.transcripcion + " " + e.results[i][0].transcript).trim(); else parcial += e.results[i][0].transcript; }
        $("#vivo").textContent = (borrador.transcripcion + " " + parcial).trim() || "Te escucho…"; };
      sr.onerror = () => {}; sr.start(); } catch(e){ sr = null; } }
    $("#grab").classList.remove("oculto"); btn.classList.add("rec"); btn.innerHTML = ic("stop"); btn.setAttribute("aria-label", "Parar"); vibrar(40);
  } catch(e){ rec = null; toast("No puedo usar el micrófono. Revisa el permiso del navegador.", "alerta", 4000); }
}
function pararVoz(){
  try { sr && sr.stop(); } catch(e){} sr = null;
  if (rec && rec.state !== "inactive") rec.stop();
  const b = $("#bMic"); b.classList.remove("rec"); b.innerHTML = ic("mic"); b.style.setProperty("--lvl", 0); b.setAttribute("aria-label", "Grabar voz");
}
$("#bMic").onclick = () => { tocado = true; rec ? pararVoz() : empezarVoz(); };

async function ubicacion(){
  if (!disp.ubi || !navigator.geolocation) return null;
  return new Promise(ok => navigator.geolocation.getCurrentPosition(p => ok({lat: +p.coords.latitude.toFixed(5), lon: +p.coords.longitude.toFixed(5)}), () => ok(null), {timeout: 4000, maximumAge: 120000}));
}

}
async function guardarCaptura(){
  if (rec) await new Promise(r => { alParar = r; pararVoz(); });
  if (vacio()){ toast("Escribe, dicta o dibuja algo primero", "pluma"); return; }
  const ahora = new Date(), n = notaBase(ahora), carpeta = `${ahora.getFullYear()}/${pad(ahora.getMonth()+1)}`, adj = [];
  n.texto = $("#cTexto").value.trim();
  if (borrador.transcripcion){ n.transcripcion = borrador.transcripcion; if (!n.texto) n.texto = borrador.transcripcion; }
  if (borrador.audio){ const t = borrador.audio.type || "", ext = t.includes("mp4") || t.includes("aac") ? "m4a" : t.includes("ogg") ? "ogg" : "webm";
    n.audio = `Audios/${carpeta}/${n.id}.${ext}`; await idb.ponerBlob(n.audio, borrador.audio); adj.push(n.audio); }
  let i = 1;
  for (const f of borrador.fotos){ const r = `Fotos/${carpeta}/${n.id}-${i++}.jpg`; await idb.ponerBlob(r, f); n.fotos.push(r); adj.push(r); }
  if (borrador.trazo){ const r = `Fotos/${carpeta}/${n.id}-trazo.png`; await idb.ponerBlob(r, await trazoComoImagen()); n.fotos.push(r); adj.push(r); }
  const s = sugerir(textoBorrador(), ahora);
  if (s.fecha && !ignorar.fecha){ n.fecha = s.fecha; if (s.hora) n.hora = s.hora; }
  if (s.tipo && !ignorar.tipo) n.tipo = s.tipo;
  if (s.cat && !ignorar.nombre) n.para = {categoria: s.cat, nombre: s.nombre};
  n.ubicacion = await ubicacion();
  if (n.audio && !n.transcripcion && voz()) n._transcribir = true;
  if (n.hora) pedirPermisoAvisos();
  await guardarNotaLocal(n, adj);
  setTimeout(procesarTranscripciones, 800);
  vibrar(80); toast(n.nocturna ? "Idea nocturna guardada" : "Guardada", n.nocturna ? "luna" : "check");
  nuevoBorrador(); anclaAbierta = null;
}

/* ================= Filas de nota ================= */
const deNotas = () => notas.filter(n => !n._borrar);
function tituloDe(n){
  if (n.ancla) return `Ancla de las ${hora(n.creada)}${n.texto ? ": " + esc(n.texto) : ""}`;
  if (n.texto) return esc(n.texto);
  return `<span class="vacio">${n.audio ? "Nota de voz" : n.fotos?.length ? "Imagen" : "Nota vacía"}</span>`;
}
function fila(n, opts = {}){
  const hoy = hoyISO(), venc = n.fecha && n.fecha < hoy && !n.hecha;
  const mt = [];
  if (n.fecha) mt.push(`<span class="fe ${venc ? "venc" : n.fecha === hoy ? "hoy" : ""}">${ic("cal")}${fechaRelativa(n.fecha)}${n.hora ? ", " + n.hora : ""}</span>`);
  if (n.para?.nombre || n.para?.categoria) mt.push(`<span>${ic("user")}${esc(n.para.nombre || CAT[n.para.categoria])}</span>`);
  if (n.tipo === "idea") mt.push(`<span>${ic("idea")}Idea</span>`);
  if (n.audio) mt.push(`<span>${ic("mic")}</span>`);
  if (n.fotos?.length > 1) mt.push(`<span>${ic("imagen")}${n.fotos.length}</span>`);
  if (n.nocturna) mt.push(`<span>${ic("luna")}</span>`);
  if (opts.hora) mt.unshift(`<span>${hora(n.creada)}</span>`);
  if (n._transcribir) mt.push(`<span class="transcribiendo">${ic("mic")}Transcribiendo</span>`);
  if (n._pend) mt.push(`<span class="nube" title="Pendiente de subir">${ic("nube")}</span>`);
  return `<div class="desl"><div class="fondo"></div><div class="fila ${n.hecha ? "hecha" : ""}" data-abrir="${n.id}">
    <button class="chk ${n.ambito === "personal" ? "personal" : ""}" data-hecha="${n.id}" aria-label="${n.hecha ? "Marcar pendiente" : "Marcar hecha"}">${ic("check")}</button>
    <div class="ct"><div class="tt">${tituloDe(n)}</div>${mt.length ? `<div class="mt">${mt.join("")}</div>` : ""}
      ${n.ancla && opts.resolver ? `<div class="resolver"><input placeholder="¿Qué era?" data-resolver="${n.id}"><button data-ok="${n.id}">Listo</button></div>` : ""}</div>
    ${n.fotos?.length ? `<img class="mini" data-mini="${n.fotos[0]}" alt="">` : ""}
  </div></div>`;
}
// Deslizar: a la derecha marca hecha, a la izquierda borra
let ignorarClick = false;
(() => {
  let fila = null, fondo = null, x0 = 0, y0 = 0, dx = 0, activo = false;
  document.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch") return;
    const f = e.target.closest(".desl .fila"); if (!f || e.target.closest("input,button")) return;
    fila = f; fondo = f.previousElementSibling; x0 = e.clientX; y0 = e.clientY; dx = 0; activo = false; fila.classList.remove("volviendo");
  }, {passive: true});
  document.addEventListener("pointermove", e => {
    if (!fila) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!activo){ if (Math.abs(mx) > 12 && Math.abs(mx) > Math.abs(my) * 1.4){ activo = true; } else if (Math.abs(my) > 12){ fila = null; return; } else return; }
    dx = mx; fila.style.transform = `translateX(${dx}px)`;
    const n = notas.find(x => x.id === fila.dataset.abrir);
    fondo.className = "fondo " + (dx > 0 ? "hecha" : "borra");
    fondo.innerHTML = dx > 0 ? ic(n?.hecha ? "deshacer" : "check") + (n?.hecha ? "Pendiente" : "Hecha") : "Borrar" + ic("borrar");
    fondo.style.opacity = Math.min(1, Math.abs(dx) / 90);
  }, {passive: true});
  const fin = async () => {
    if (!fila) return; const f = fila, fd = fondo, d = dx; fila = null;
    if (!activo) return;
    ignorarClick = true; setTimeout(() => ignorarClick = false, 350);
    f.classList.add("volviendo"); f.style.transform = ""; fd.style.opacity = 0;
    const n = notas.find(x => x.id === f.dataset.abrir); if (!n) return;
    if (d > 90){ vibrar(30); await alternarHecha(n); }
    else if (d < -90){ vibrar(30); borrarNota(n); }
  };
  document.addEventListener("pointerup", fin); document.addEventListener("pointercancel", fin);
})();
async function alternarHecha(n){
  const marcar = v => { n.hecha = v; n.hechaEn = v ? new Date().toISOString() : null; };
  marcar(!n.hecha); await guardarNotaLocal(n); refrescar();
  toast(n.hecha ? "Hecha" : "Pendiente de nuevo", n.hecha ? "check" : "deshacer", 4000, async () => { marcar(!n.hecha); await guardarNotaLocal(n); refrescar(); });
}
function cargarMinis(cont){ cont.querySelectorAll("[data-mini]").forEach(img => urlAdjunto(img.dataset.mini).then(u => img.src = u).catch(() => {})); }

    chk.closest(".fila")?.classList.toggle("hecha", !n.hecha); setTimeout(() => alternarHecha(n), 250); return; }

  if (ok){ e.stopPropagation(); const n = nota(ok.dataset.ok), v = document.querySelector(`[data-resolver="${ok.dataset.ok}"]`).value.trim(); if (!v) return;
    n.texto = v; n.ancla = false; const s = sugerir(v, new Date(n.creada)); if (s.fecha){ n.fecha = s.fecha; if (s.hora) n.hora = s.hora; } if (s.tipo) n.tipo = s.tipo; if (s.cat) n.para = {categoria: s.cat, nombre: s.nombre};

const voz = () => !!(config.voz?.clave && config.voz?.region);
async function aWav16k(blob){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let buf; try { buf = await ctx.decodeAudioData(await blob.arrayBuffer()); } finally { try { ctx.close(); } catch(e){} }
  const sr = 16000, len = Math.ceil(buf.duration * sr);
  const off = new OfflineAudioContext(1, Math.max(len, 1), sr);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const out = (await off.startRendering()).getChannelData(0);
  const trozo = 50 * sr, wavs = [];
  for (let i = 0; i < out.length; i += trozo) wavs.push(wavPCM(out.subarray(i, Math.min(out.length, i + trozo)), sr));
  return wavs;
}
function wavPCM(muestras, sr){
  const b = new ArrayBuffer(44 + muestras.length * 2), v = new DataView(b), w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };

  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, muestras.length * 2, true);
  for (let i = 0; i < muestras.length; i++){ const x = Math.max(-1, Math.min(1, muestras[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([b], {type: "audio/wav"});
}
async function reconocer(wav){
  const url = `https://${config.voz.region}.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=es-ES&format=simple`;
  let r;
  try { r = await fetch(url, {method: "POST", headers: {"Ocp-Apim-Subscription-Key": config.voz.clave, "Content-Type": "audio/wav; codecs=audio/pcm; samplerate=16000", "Accept": "application/json"}, body: wav}); }
  catch(e){ return reconocerSDK(wav); }                    // si el navegador bloquea la llamada directa, se usa el kit oficial de Microsoft
  if (r.status === 401 || r.status === 403) throw new Error("La clave o la región no son correctas");
  if (!r.ok) throw new Error(`Azure Speech respondió ${r.status}`);
  const j = await r.json();
  return j.RecognitionStatus === "Success" ? (j.DisplayText || "") : "";
}
async function reconocerSDK(wav){
  if (!window.SpeechSDK) await new Promise((ok, ko) => { const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"; s.onload = ok; s.onerror = () => ko(new Error("No se pudo conectar con Azure Speech")); document.head.appendChild(s); });

  const rec = new S.SpeechRecognizer(cfg, S.AudioConfig.fromWavFileInput(new File([wav], "nota.wav", {type: "audio/wav"})));
  return new Promise((ok, ko) => { const partes = [];
    rec.recognized = (_, e) => { if (e.result.reason === S.ResultReason.RecognizedSpeech && e.result.text) partes.push(e.result.text); };
    rec.canceled = (_, e) => { rec.close(); e.reason === S.CancellationReason.Error ? ko(new Error(e.errorCode === 1 || /401|403|auth/i.test(e.errorDetails) ? "La clave o la región no son correctas" : "Azure Speech: " + e.errorDetails)) : ok(partes.join(" ")); };

const contar = (l, f) => { const o = {}; for (const n of l){ const k = f(n); if (k) o[k] = (o[k] || 0) + 1; } return o; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function barrasLista(filas, opts = {}){
  // filas: [{et, v, sub?}] ya ordenadas; ancho proporcional al máximo
  if (!filas.length) return `<div class="cuenta">${opts.vacio || "Aún sin datos en este periodo."}</div>`;
  const top = Math.max(...filas.map(f => f.v), 1), total = opts.total || 0;
  return filas.map(f => `<div class="bar" data-tip="${esc(f.tip || `${f.et}: ${f.v} ${f.v === 1 ? "nota" : "notas"}`)}">
    <div class="et">${esc(f.et)}${f.sub ? `<small>${esc(f.sub)}</small>` : ""}</div>
    <div class="pi"><i style="width:${Math.max(2, f.v / top * 100)}%;background:${opts.color || "var(--cw)"}"></i></div>
    <div class="v">${f.v}${total ? `<small>${pct(f.v, total)}%</small>` : ""}</div></div>`).join("");
}
function cubos(desde, dias){
  // agrupa por día, semana o mes según la longitud del periodo, siempre en orden cronológico
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const modo = dias && dias <= 31 ? "dia" : dias && dias <= 120 ? "semana" : "mes";
  const lunes = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const clave = d => modo === "dia" ? isoDia(d) : modo === "semana" ? isoDia(lunes(d)) : `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const lista = [];
  if (modo === "dia"){ for (let d = new Date(desde); d <= hoy; d.setDate(d.getDate() + 1)) lista.push({k: clave(d), et: d.toLocaleDateString("es-ES", {day: "numeric", month: "short"}).replace(".", ""), d: new Date(d)}); }
  else if (modo === "semana"){ for (let d = lunes(desde); d <= hoy; d.setDate(d.getDate() + 7)) lista.push({k: clave(d), et: "Semana del " + d.toLocaleDateString("es-ES", {day: "numeric", month: "short"}).replace(".", ""), d: new Date(d)}); }
  else { const ini = new Date(desde.getFullYear(), desde.getMonth(), 1); for (let d = ini; d <= hoy; d.setMonth(d.getMonth() + 1)) lista.push({k: clave(d), et: capital(d.toLocaleDateString("es-ES", {month: "long", year: "numeric"})), d: new Date(d)}); }
  return {modo, lista, clave};
}

      const q = qrcode(0, "M"); q.addData(url, "Byte"); q.make();
      $("#qr").innerHTML = `<div style="background:#fff;display:inline-block;padding:14px;border-radius:18px;margin:6px 0 14px">${q.createSvgTag({cellSize: 6, margin: 1})}</div>`;
    } catch(e){ $("#qr").innerHTML = `<div class="cuenta" style="word-break:break-all;margin-bottom:12px">${esc(url)}</div>`; }
  };
}

  }
